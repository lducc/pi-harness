audience: "GPU systems and machine-learning researchers"
venue:
  name: "two-column systems/ML paper"
  layout: "double-column"
  target_width_mm: 178
academic_style:
  policy: "scientific-figure-design/assets/academic-style.yaml"
  exceptions: []
paper_palette:
  path: "paper-palette.yaml"
  palette_id: "kernel-agent-paper-v1"
  status: "frozen"
  role_assignments:
    ours: "accent"
    strong_baseline: "secondary"
    other_baselines: "neutral"
