name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: python -m pip install ruff

      - name: Lint
        run: ruff check scripts tests

      - name: Compile
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate bundled icon catalog
        run: |
          python -m json.tool assets/paper-icons/library/catalog.json >/dev/null
          python -m json.tool assets/paper-icons/library/license-manifest.json >/dev/null
          test "$(find assets/paper-icons/library -type f -name '*.svg' | wc -l)" -eq 581

      - name: Build and validate an editable figure
        run: |
          cp examples/kernel-agent-loop/figure-spec.json /tmp/figure-spec.json
          cp examples/kernel-agent-loop/paper-palette.yaml /tmp/paper-palette.yaml
          python scripts/build_drawio_figure.py /tmp/figure-spec.json \
            --paper-palette /tmp/paper-palette.yaml \
            --out /tmp/figure.drawio
          python scripts/validate_drawio_figure.py /tmp/figure.drawio \
            --paper-palette /tmp/paper-palette.yaml --strict
